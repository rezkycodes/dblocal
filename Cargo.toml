[workspace]
members = [
    "crates/core",
    "crates/gui",
    "crates/cli",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
flate2 = "1.1"
keyring = "4.2"
liblzma = "0.4"
mysql_async = "0.37"
nix = { version = "0.32", features = ["signal", "process"] }
percent-encoding = "2"
postgres-protocol = "0.6"
rand = "0.10"
redis = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.40"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
zeroize = { version = "1", features = ["alloc"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# GPUI Kit umbrella pin (D-25): one crate re-exporting the pinned GPUI stack
# (gpui-pre 0.3.12, gpui-component 0.10.0, gpui-kit-assets 0.10.0).
gpui-kit = "=0.10.0"
tray-icon = "0.26"

dblocal-core = { path = "crates/core" }
dblocal-gui = { path = "crates/gui" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
