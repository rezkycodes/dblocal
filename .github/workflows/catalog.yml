name: Catalog refresh

on:
  schedule:
    # Daily at 05:17 UTC (off the hour to spread load across GitHub runners).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Build engine catalog and open PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # refs/heads/stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build catalog
        env:
          # F-CAT-03 edge case: authenticated GitHub API usage avoids low
          # unauthenticated rate limits when querying upstream release metadata.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo xtask catalog build --output catalog/engines-v3.json --compat-v2-output catalog/engines-v2.json
          cargo xtask catalog validate --file catalog/engines-v3.json
          cargo xtask catalog validate --file catalog/engines-v2.json

      - name: Create pull request
        # F-CAT-03 AC3: always a PR, never a direct push to main.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(catalog): refresh engines catalog"
          branch: automation/catalog-refresh
          delete-branch: true
          title: "chore(catalog): refresh engines catalog"
          body: |
            Automated daily refresh of `catalog/engines-v3.json` (and the derived
            Redis-free `catalog/engines-v2.json` for released `v0.1.3`/`v0.1.4`
            clients) via `cargo xtask catalog build`.

            - Sources queried per F-CAT-03: GitHub Releases for PostgreSQL, the
              `downloads.mariadb.org` REST API for MariaDB, the official MySQL
              download endpoints, `download.valkey.io` for Valkey, and the
              official `packages.redis.io/deb` APT repository for Redis.
            - Every artifact entry must carry a SHA-256 (from an upstream `.sha256`
              file when present, otherwise computed here). Entries without a
              checksum are rejected by the xtask.
            - This PR is never auto-merged; human review is required before merge
              into `main`.

            Trigger: `${{ github.event_name }}` (run `${{ github.run_id }}`).
          add-paths: |
            catalog/engines-v3.json
            catalog/engines-v2.json
          labels: |
            catalog
            automation
