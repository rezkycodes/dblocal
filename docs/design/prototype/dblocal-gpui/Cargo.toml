[package]
name = "dblocal"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "DBLocal — manage local database servers (PostgreSQL, MySQL, MariaDB, Valkey) without containers. UI prototype built with GPUI Kit."

[[bin]]
name = "dblocal"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.10.0"
anyhow = "1"

# GPUI is heavy in debug mode; optimize UI crates so `cargo run` stays smooth.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
