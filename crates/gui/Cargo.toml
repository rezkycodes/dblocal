[package]
name = "dblocal-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
demo = ["dblocal-core/mock"]

[dependencies]
dblocal-core = { workspace = true }
gpui-kit = { workspace = true }
flume = { version = "0.11", default-features = false, features = ["async"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { version = "30.0.1", default-features = true }

[dev-dependencies]
dblocal-core = { workspace = true, features = ["mock"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = "0.25"
# The a11y harness (tests/support/a11y_platform.rs) wraps a gpui PlatformWindow,
# so it needs the same raw-window-handle gpui uses, and futures' oneshot.
futures = "0.3"
raw-window-handle = "0.6"
# The a11y harness implements gpui's `PlatformWindow::get_raw_handle` on Windows,
# whose signature names `windows::Win32::Foundation::HWND`. This is the exact
# version gpui-pre already resolves (Cargo.lock), so no new package is added.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }


[lints]
workspace = true
