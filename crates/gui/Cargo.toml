[package]
name = "dblocal-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The X11 backend additionally needs the `libxkbcommon-x11` development package
# (Fedora: libxkbcommon-x11-devel, Debian: libxkbcommon-x11-dev). Wayland is the
# default on this host; see docs/dev/linux-build-deps.md.
x11 = ["gpui-platform/x11"]

[dependencies]
# W1 only: the GUI runs against the in-memory mock. W2-B must drop this feature
# from the production build and reach `LocalService` through `run_with_service`;
# see docs/architecture/gui.md ("Wave 2 seam").
dblocal-core = { workspace = true, features = ["mock"] }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-kit-assets = "0.10.0"
flume = { version = "0.11", default-features = false, features = ["async"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["wayland"] }
wgpu = { version = "30.0.1", default-features = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["wayland", "test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
image = "0.25"

[lints]
workspace = true
